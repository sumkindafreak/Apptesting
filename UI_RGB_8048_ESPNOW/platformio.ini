; Showduino UI for ESP32-8048S043 (4.3" 800x480 RGB, ESP32-S3, GT911 touch)
; Default target: esp32-8048S043C (capacitive). Use esp32-8048S043R for resistive.

[platformio]
default_envs = esp32-8048S043C
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
board_build.partitions = default_16MB.csv

build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git

[env:esp32-8048S043C]
board = esp32-8048S043C

[env:esp32-8048S043R]
board = esp32-8048S043R

[env:esp32-8048S043N]
board = esp32-8048S043N

[env:esp32-8048S050C]
board = esp32-8048S050C

[env:JC8048W550C]
board = JC8048W550C
